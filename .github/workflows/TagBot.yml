name: TagBot
on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
permissions:
  contents: write
  issues: write

jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update release notes from CHANGELOG
        run: |
          sleep 5
          TAG=$(git describe --tags --abbrev=0)
          VERSION="${TAG#v}"
          NOTES=$(awk "/^## \\[$VERSION\\]/{flag=1;next}/^## \\[/{flag=0}flag" CHANGELOG.md | sed '/./,$!d' | sed -n ':a;N;$!ba;s/\n*$//')
          if [ -n "$NOTES" ]; then
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes "$NOTES"
            else
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "ManifoldMeshes.jl $TAG" --notes "$NOTES"
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
