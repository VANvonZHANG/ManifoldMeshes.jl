name: JuliaFormatter
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'
      - name: Install JuliaFormatter
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.add("JuliaFormatter")
      - name: Check formatting
        shell: julia --color=yes {0}
        run: |
          using JuliaFormatter
          format(".")
      - name: Verify no changes
        run: |
          if git diff --quiet; then
            echo "Formatting OK."
          else
            echo "ERROR: Code is not formatted. Run 'julia -e '"'"'using JuliaFormatter; format(\".\")'"'"' locally and commit the changes."
            git diff --stat
            exit 1
          fi
